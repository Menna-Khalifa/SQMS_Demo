<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111d">
<title>SQMS Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="noise"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="shell">
<aside id="sidebar" class="sidebar">
<div class="brand">
<div class="brandIcon"><i data-lucide="shield-check"></i></div>
<div><b>SQMS</b><span id="brandSub">إدارة الجودة الأمنية</span></div>
</div>
<div class="demo"><i data-lucide="flask-conical"></i><span id="demoLabel">نسخة تجريبية ببيانات وهمية</span></div>
<nav id="nav" class="nav"></nav>
<div class="sideFoot"><i data-lucide="lock"></i><div><b id="sideFootTitle">نطاقات وصول حقيقية في النظام النهائي</b><span id="sideFootSub">الديمو يحاكي الواجهة وتدفق الصلاحيات</span></div></div>
</aside>

<main>
<header>
<div class="headStart">
<button id="menu" class="icon mobile" aria-label="القائمة"><i data-lucide="menu"></i></button>
<div><span class="eyebrow">SECURITY QUALITY WORKSPACE</span><h1 id="title">لوحة التحكم</h1></div>
</div>
<div class="headActions">
<button id="searchBtn" class="search"><i data-lucide="search"></i><span id="searchLabel">بحث سريع</span><kbd>⌘ K</kbd></button>
<button class="icon" onclick="go('demo_guide')" title="دليل الديمو"><i data-lucide="map"></i></button>
<button id="lang" class="icon" title="تغيير اللغة"><i data-lucide="languages"></i></button>
<button id="bell" class="icon dot" title="الإشعارات"><i data-lucide="bell"></i></button>
<div class="roleWrap">
<button id="roleBtn" class="roleBtn"><span class="avatar">س</span><span class="roleTxt"><b id="roleName">سلطان — مالك النظام</b><small id="roleScope">كل المشاريع</small></span><i data-lucide="chevron-down"></i></button>
<div id="roleMenu" class="roleMenu"></div>
</div>
</div>
</header>
<section id="content" class="content"></section>
</main>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="overlay hidden"><div class="modal"><button id="modalClose" class="close" aria-label="إغلاق"><i data-lucide="x"></i></button><div id="modalBody"></div></div></div>
<div id="searchLayer" class="searchLayer hidden"><div class="searchPanel"><div class="searchHead"><i data-lucide="search"></i><input id="globalSearch" placeholder="ابحث بالاسم أو الهوية أو الرقم الوظيفي أو رقم الحالة"><button id="searchClose" class="icon"><i data-lucide="x"></i></button></div><p id="searchHint">النتائج تخضع لصلاحيات الحساب الحالي والبلاغات الحساسة لا تظهر في البحث العام</p><div id="searchResults"></div></div></div>

<script src="app.js"></script>
</body>
</html>
